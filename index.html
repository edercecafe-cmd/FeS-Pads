<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aura Pads — Pads musicais</title><meta name="description" content="Pads sustentados nos 12 tons, maiores e menores, com volume e transição suave."><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23191d28'/%3E%3Cpath d='M7 23V9h5v14m3 0V5h4v18m3 0V12h4v11' stroke='%23d4fc82' stroke-width='2'/%3E%3C/svg%3E"><style>
:root{color-scheme:dark;--bg:#10131a;--panel:#191e28;--line:#303746;--lime:#d4fc82;--muted:#a5aebb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f5f6f8;font:16px system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:36px 28px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:24px}h1{font-size:24px;margin:0;letter-spacing:-1px}h1 span{color:var(--lime)}.tag{font-size:14px;color:var(--muted)}.top{display:flex;justify-content:space-between;align-items:end;margin:30px 0 24px}h2{font-size:32px;letter-spacing:-1px;margin:0 0 7px}p{color:var(--muted);margin:0;line-height:1.6}button{font:inherit;cursor:pointer;color:inherit;border:1px solid var(--line);background:var(--panel);border-radius:12px}button:focus-visible,input:focus-visible{outline:3px solid var(--lime);outline-offset:4px}.modes{display:flex;padding:5px;background:var(--panel);border:1px solid var(--line);border-radius:14px}.modes button{border:0;padding:12px 22px;background:none}.modes .chosen{background:var(--lime);color:#16200b}.pads{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}.pad{height:126px;text-align:left;padding:20px;transition:background .2s,transform .2s;position:relative}.pad:hover{background:#252d3b;transform:translateY(-2px)}.pad strong{font-size:32px;display:block;font-weight:600}.pad small{font-size:14px;color:var(--muted)}.pad .key{position:absolute;right:14px;top:14px;font-size:12px;color:#85909f}.pad.active{background:var(--lime);border-color:var(--lime);color:#18220c;box-shadow:0 0 36px #d4fc8212}.pad.active small,.pad.active .key{color:#405326}.desk{margin-top:28px;border:1px solid var(--line);border-radius:18px;padding:26px;background:var(--panel);display:grid;grid-template-columns:1.1fr 1fr;gap:30px}.eyebrow{font-size:14px;color:var(--muted)}#current{font-size:38px;margin:9px 0 2px;font-weight:600}#notes{color:var(--lime)}.transport{display:flex;gap:12px;align-items:center;margin-top:22px}.transport button{padding:12px 18px}#stop{background:#f2f4f8;color:#171b24;border-color:#f2f4f8}label{display:flex;justify-content:space-between;font-size:14px;margin:0 0 10px}input[type=range]{width:100%;accent-color:var(--lime);margin:0 0 25px;height:18px}.scale{border-top:1px solid var(--line);margin-top:24px;padding-top:20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.scale span{color:var(--muted);font-size:14px}.scale b{font-weight:500;padding:8px 12px;border:1px solid var(--line);border-radius:7px;font-size:14px}.foot{margin-top:22px;font-size:14px}#status{font-size:14px;color:var(--muted)}@media(max-width:760px){main{padding:24px 18px}.top{display:block}h2{font-size:27px}.modes{margin-top:18px;width:fit-content}.pads{grid-template-columns:repeat(3,1fr);gap:10px}.pad{height:108px;padding:16px}.desk{grid-template-columns:1fr;gap:22px;padding:20px}.tag{max-width:120px;text-align:right}.pad strong{font-size:27px}.scale{gap:8px}}
</style></head><body><main><header><h1>AURA<span> / PADS</span></h1><span class="tag">Instrumento ambiente</span></header><div class="top"><div><h2>Encontre o seu tom.</h2><p>Toque em um pad para criar uma base contínua.</p></div><div class="modes" aria-label="Escala"><button class="chosen" id="major" aria-pressed="true">Maior</button><button id="minor" aria-pressed="false">Menor</button></div></div><section class="pads" id="pads" aria-label="Pads nos 12 tons"></section><section class="desk"><div><div class="eyebrow">PAD SELECIONADO</div><div id="current">C maior</div><p id="notes">Dó · Mi · Sol</p><div class="transport"><button id="stop">■ Parar</button><span id="status" role="status">Pronto para tocar</span></div></div><div><label for="volume">Volume <output id="vout">35%</output></label><input id="volume" type="range" min="0" max="100" value="35"><label for="fade">Transição suave <output id="fout">2 s</output></label><input id="fade" type="range" min="0.2" max="5" value="2" step="0.1"></div></section><div class="scale" id="scale"></div><p class="foot">Atalhos: A W S E D F T G Y H U J para os 12 tons. Espaço para parar.<br>O áudio começa após o primeiro toque. Use volume moderado.</p></main><script>
const names=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'],sol=['Dó','Dó♯','Ré','Ré♯','Mi','Fá','Fá♯','Sol','Sol♯','Lá','Lá♯','Si'],keys=['a','w','s','e','d','f','t','g','y','h','u','j'];let root=0,minor=false,playing=false,ctx,master,voices=null,request=0;const el=id=>document.getElementById(id);const buttons=names.map((n,i)=>{let b=document.createElement('button');b.className='pad';b.innerHTML='<span class="key">'+keys[i].toUpperCase()+'</span><strong>'+n+'</strong><small>'+sol[i]+'</small>';b.onclick=()=>play(i);el('pads').append(b);return b});
function refresh(){el('current').textContent=names[root]+' '+(minor?'menor':'maior');el('notes').textContent=[0,minor?3:4,7].map(x=>sol[(root+x)%12]).join(' · ');el('scale').innerHTML='<span>ESCALA '+(minor?'MENOR NATURAL':'MAIOR')+'</span>'+ (minor?[0,2,3,5,7,8,10]:[0,2,4,5,7,9,11]).map(x=>'<b>'+names[(root+x)%12]+'</b>').join('');buttons.forEach((b,i)=>{b.classList.toggle('active',playing&&i===root);b.setAttribute('aria-pressed',String(playing&&i===root));b.setAttribute('aria-label',sol[i]+' '+(minor?'menor':'maior'))});el('major').classList.toggle('chosen',!minor);el('minor').classList.toggle('chosen',minor);el('major').setAttribute('aria-pressed',String(!minor));el('minor').setAttribute('aria-pressed',String(minor));el('status').textContent=playing?'Tocando · som sustentado':'Pronto para tocar'}
async function init(){if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.gain.value=Number(el('volume').value)/100*.65;let compressor=ctx.createDynamicsCompressor();master.connect(compressor);compressor.connect(ctx.destination)}await ctx.resume();if(ctx.state!=='running')throw Error('Áudio bloqueado')}
function release(v,secs){if(!v)return;let t=ctx.currentTime;v.g.gain.cancelScheduledValues(t);v.g.gain.setTargetAtTime(0,t,Math.max(.02,secs/4));v.os.forEach(o=>o.stop(t+secs+0.2));setTimeout(()=>v.g.disconnect(),(secs+.4)*1000)}
async function play(i){const token=++request;try{await init();if(token!==request)return;root=i;const dur=Number(el('fade').value);release(voices,dur);let g=ctx.createGain();g.gain.setValueAtTime(0,ctx.currentTime);g.gain.linearRampToValueAtTime(.18,ctx.currentTime+dur);let filter=ctx.createBiquadFilter();filter.type='lowpass';filter.frequency.value=1600;filter.Q.value=.5;g.connect(filter);filter.connect(master);let os=[];[0,minor?3:4,7,12].forEach((step,index)=>{[-5,5].forEach(detune=>{let o=ctx.createOscillator(),gain=ctx.createGain();o.type='triangle';o.frequency.value=440*Math.pow(2,(48+i+step-69)/12);o.detune.value=detune;gain.gain.value=index===3?.18:.3;o.connect(gain);gain.connect(g);o.start();os.push(o)})});voices={g,os};playing=true;refresh()}catch(e){el('status').textContent='Não foi possível iniciar o áudio. Toque novamente.'}}
function stop(){request++;release(voices,.4);voices=null;playing=false;refresh();el('status').textContent='Som interrompido'}el('stop').onclick=stop;el('major').onclick=()=>setMode(false);el('minor').onclick=()=>setMode(true);function setMode(m){minor=m;refresh();if(playing)play(root)}el('volume').oninput=()=>{let v=Number(el('volume').value);el('vout').value=v+'%';if(master)master.gain.setTargetAtTime(v/100*.65,ctx.currentTime,.05)};el('fade').oninput=()=>el('fout').value=Number(el('fade').value).toLocaleString('pt-BR')+' s';document.addEventListener('keydown',e=>{if(e.repeat||e.ctrlKey||e.altKey||e.metaKey||['INPUT','SELECT','TEXTAREA','BUTTON'].includes(e.target.tagName))return;if(e.code==='Space'){e.preventDefault();stop();return}let i=keys.indexOf(e.key.toLowerCase());if(i>=0){e.preventDefault();play(i)}});window.addEventListener('pagehide',stop);refresh();
if(document.modelContext?.registerTool){try{Promise.resolve(document.modelContext.registerTool({name:'configure_pad',description:'Seleciona o tom e a escala do pad sem iniciar áudio.',inputSchema:{type:'object',properties:{tone:{type:'integer',minimum:0,maximum:11},minor:{type:'boolean'}},required:['tone','minor'],additionalProperties:false},execute(input){if(!Number.isInteger(input.tone)||input.tone<0||input.tone>11||typeof input.minor!=='boolean')throw Error('Tom ou escala inválidos');stop();root=input.tone;minor=input.minor;refresh();return{tone:names[root],scale:minor?'menor':'maior',playing:false}}})).catch(()=>{})}catch{}}
</script></body></html>
